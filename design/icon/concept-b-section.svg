<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 方案 B：靛蓝渐变圆角方块 + 白色段落符号 §（语义最直白：符号字符本身） -->
  <defs>
    <linearGradient id="b-bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#8B93F9"/>
      <stop offset="0.48" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.28" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b-vignette" cx="0.5" cy="1" r="0.85">
      <stop offset="0.45" stop-color="#312E81" stop-opacity="0"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.30"/>
    </radialGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#b-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#b-glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#b-vignette)"/>

  <text x="256" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="330"
        fill="#FFFFFF">§</text>
</svg>
