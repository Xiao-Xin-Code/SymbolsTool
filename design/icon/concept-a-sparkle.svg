<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 方案 A：靛蓝渐变圆角方块 + 白色四角星（延续托盘图标与面板 sparkles 标记） -->
  <defs>
    <linearGradient id="a-bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#8B93F9"/>
      <stop offset="0.48" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="0.28" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-vignette" cx="0.5" cy="1" r="0.85">
      <stop offset="0.45" stop-color="#312E81" stop-opacity="0"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.30"/>
    </radialGradient>
    <linearGradient id="a-star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E9FF"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#a-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#a-glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#a-vignette)"/>

  <!-- 四角星（凹边），半径 118，中心 256,256 -->
  <path fill="url(#a-star)"
        d="M256 138 C264.4 214.2 297.8 247.6 374 256 C297.8 264.4 264.4 297.8 256 374 C247.6 297.8 214.2 264.4 138 256 C214.2 247.6 247.6 214.2 256 138 Z"/>
</svg>
